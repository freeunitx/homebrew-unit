name: Dispatch build bottle
run-name: Build bottle of ${{ inputs.formula }} on ${{ inputs.runner }}

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Build runner or comma-separated runners
        required: true
        default: ubuntu-24.04
      formula:
        description: Formula name
        required: true
      timeout:
        description: Build timeout in minutes
        default: "180"
        required: true

permissions:
  contents: read

env:
  HOMEBREW_DEVELOPER: "1"
  HOMEBREW_GITHUB_ACTIONS: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_RELOCATABLE_INSTALL_NAMES: "1"
  DISPATCH_BUILD_BOTTLE_FORMULA: ${{ inputs.formula }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      runners: ${{ steps.runner-matrix.outputs.result }}
    steps:
      - name: Prepare runner matrix
        id: runner-matrix
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const linuxRegex = /^(ubuntu-|linux-self-hosted-)/
            return context.payload.inputs.runner.split(',')
              .map(s => s.trim())
              .filter(Boolean)
              .map(s => {
                if (linuxRegex.test(s)) {
                  return {
                    runner: s,
                    container: {
                      image: 'ghcr.io/homebrew/brew:main',
                      options: '--user=linuxbrew -e GITHUB_ACTIONS_HOMEBREW_SELF_HOSTED'
                    },
                    workdir: '/github/home',
                    cleanup: false
                  }
                }
                return {runner: s, cleanup: true}
              })

  bottle:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.runners) }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }} # zizmor: ignore[unpinned-images]
    timeout-minutes: ${{ fromJson(inputs.timeout) }}
    defaults:
      run:
        shell: /bin/bash -e {0}
        working-directory: ${{ matrix.workdir || github.workspace }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BOTTLES_DIR: ${{ matrix.workdir || github.workspace }}/bottles
    steps:
      - name: Pre-test steps
        uses: Homebrew/actions/pre-build@2026.11.23.1
        with:
          bottles-directory: ${{ env.BOTTLES_DIR }}
          cleanup: ${{ matrix.cleanup }}

      - name: Build bottle
        working-directory: ${{ env.BOTTLES_DIR }}
        run: |
          set -o pipefail
          REPO="${GITHUB_REPOSITORY##*/}"
          TAP_NAME="${REPO#homebrew-}"
          TAP="${GITHUB_REPOSITORY_OWNER}/${TAP_NAME}"
          ROOT_URL="https://ghcr.io/v2/${GITHUB_REPOSITORY_OWNER}/${TAP_NAME}"
          brew test-bot \
            --only-formulae \
            --keep-old \
            --only-json-tab \
            --skip-online-checks \
            --skip-dependents \
            --root-url="${ROOT_URL}" \
            "${TAP}/${DISPATCH_BUILD_BOTTLE_FORMULA}" 2>&1 | tee test-bot.log

      - name: Check the test-bot result
        if: always()
        working-directory: ${{ env.BOTTLES_DIR }}
        run: |
          if [[ ! -f test-bot.log ]]; then
            echo "::error::test-bot did not produce a log"
            exit 1
          fi
          if grep -qE "failed step ignored|^Error: .*failed step" test-bot.log; then
            echo "::error::test-bot reported a failed step"
            grep -E "failed step ignored|^Error: .*failed step|==> FAILED" test-bot.log
            exit 1
          fi

      - name: Post-build steps
        if: always()
        uses: Homebrew/actions/post-build@2026.11.23.1
        with:
          runner: ${{ matrix.runner }}
          cleanup: ${{ matrix.cleanup }}
          bottles-directory: ${{ env.BOTTLES_DIR }}
          logs-directory: ${{ format('{0}/logs', env.BOTTLES_DIR) }}
