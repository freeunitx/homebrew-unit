name: brew test-bot

on:
  pull_request:

jobs:
  check-generate:
    # The job checks the syntax of the formulae and builds the matrix. The
    # checks do not depend on the operating system. The job runs on Linux,
    # because the pool of the macOS runners is often full. A job that waits
    # for a runner for 15 minutes is cancelled by GitHub.
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@2026.11.23.1
        with:
          core: true

      - name: Cache Homebrew Bundler RubyGems
        id: cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      - name: Install Homebrew Bundler RubyGems
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install-bundler-gems

      - run: brew test-bot --only-tap-syntax

      - run: brew test-bot --only-formulae-detect
        id: formulae-detect

      - name: generate matrix
        id: generate-matrix
        run: |
          JSON="{\"include\":["
          for os in macos-26 ubuntu-24.04; do
          for formula in $( echo ${{ steps.formulae-detect.outputs.testing_formulae }} | tr ',' ' ' ); do
            JSON="$JSON$( jq -nRr '( $ARGS.positional[] | { os: $os, formulae: . }) | tojson' --arg os "$os" --args "$formula" ),"
          done
          done

          if [[ "$JSON" == *, ]]; then
            JSON="${JSON%?}"
          fi
          JSON="$JSON]}"
          echo "$JSON"
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"

  build-formulae:
    name: ${{ matrix.os }}, ${{ matrix.formulae }}
    needs: check-generate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.check-generate.outputs.matrix)}}

    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@2026.11.23.1
        with:
          core: true

      - name: Cache Homebrew Bundler RubyGems
        id: cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      - name: Install Homebrew Bundler RubyGems
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install-bundler-gems

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - name: build ${{ matrix.formulae }}
        run: |
          formula=${{ matrix.formulae }}
          # The tap name comes from the formula name. It works for the
          # upstream tap and for a fork. The name of the formula alone must
          # not be used, because the case patterns need the bare name.
          tap="${formula%/*}"
          name="${formula##*/}"
          case "$name" in
            unit-php@*)
              series="${name##*@}"
              formula="$tap/php-embed@$series,$tap/unit,$formula"
              ;;
            unit-php)
              formula="$tap/php-embed,$tap/unit,$formula"
              ;;
            unit-*)
              formula="$tap/unit,$formula"
              ;;
          esac
          brew test-bot --only-formulae --testing-formulae="$formula" 2>&1 | tee test-bot.log

      - name: check the test-bot result
        if: always()
        run: |
          # The test-bot ignores a failed step of a formula without a bottle,
          # so the job stays green. Its summary names the failed step.
          if grep -qE "failed step ignored|^Error: .*failed step" test-bot.log
          then
            echo "::error::test-bot reported a failed step"
            grep -E "failed step ignored|^Error: .*failed step|==> FAILED" test-bot.log
            exit 1
          fi
