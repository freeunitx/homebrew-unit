name: Rebuild everything
on:
  schedule:
    - cron:  '30 0 * * Mon'
  workflow_dispatch:
jobs:
  test-bot:
    name: Check syntax
    runs-on: macos-26
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@2026.11.23.1
        with:
          core: true

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

  build-unit:
    name: Build Unit
    needs: test-bot
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-26]
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@2026.11.23.1
        with:
          core: true

      - name: Build Unit
        run:
          brew install --build-from-source unit

  build-unit-perl:
    name: Build Unit Perl module
    needs: build-unit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-26]
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@2026.11.23.1
        with:
          core: true

      - name: Set tap name
        id: set-tap
        run: |
          REMOTE_URL="$(git -c safe.directory='*' remote get-url origin)"
          OWNER="$(echo "${REMOTE_URL}" | sed -E 's#^.*github\.com[:/]+([^/]+)/.*$#\1#')"
          REPO="$(echo "${REMOTE_URL}" | sed -E 's#^.*github\.com[:/]+[^/]+/([^/]+)$#\1#')"
          TAP="${OWNER}/${REPO#homebrew-}"
          echo "tap=${TAP}" >> "$GITHUB_OUTPUT"

      - name: Build Unit Perl module
        run: |
          brew install --build-from-source perl
          brew install --build-from-source ${{ steps.set-tap.outputs.tap }}/unit-perl

  build-unit-python3:
    name: Build Unit Python 3 module
    needs: build-unit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-26]
    steps:
      - name: Set up Homebrew
