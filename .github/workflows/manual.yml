          TAP="${OWNER}/${REPO#homebrew-}"
          echo "tap=${TAP}" >> "$GITHUB_OUTPUT"

      - name: Build Unit Python 3 module
        run:
          brew install --build-from-source ${{ steps.set-tap.outputs.tap }}/unit-python3

  build-unit-java:
    name: Build Unit Java module
